version: 2
updates:
  # Two direct dependencies: passmcp-reporting, whose graph package is the
  # data model, and the policy file's YAML parser. This also keeps the
  # toolchain directive current.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"

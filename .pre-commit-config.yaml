# Local mirrors of the cheap CI gates, so the red appears before the push.
#
#   pip install pre-commit && pre-commit install
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The licence texts are verbatim copies and are never rewritten.
      - id: end-of-file-fixer
        exclude: ^(LICENSE$|LICENSES/)
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      # devcontainer.json is JSON with comments, as the Dev Container
      # specification allows; plain JSON parsers reject it.
      - id: check-json
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--ignore-words-list=intoto]
        exclude: ^(go\.sum$|LICENSE$|LICENSES/|.*\.svg$)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: spdx
        name: SPDX headers
        entry: make spdx-check
        language: system
        pass_filenames: false

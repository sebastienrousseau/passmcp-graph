site_name: passmcp-graph
site_description: A local graph of agents, MCP servers, tools and identities, built from passmcp's evidence.
site_url: https://sebastienrousseau.com/passmcp-graph/
repo_url: https://github.com/sebastienrousseau/passmcp-graph
repo_name: sebastienrousseau/passmcp-graph
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: public
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Ingesting evidence: ingest.md
  - Query language: query-language.md
  - Policies: policy.md
  - Release notes:
      - "0.0.1": releases/v0.0.1.md

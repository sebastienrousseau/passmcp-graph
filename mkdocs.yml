site_name: passmcp-graph
site_description: A local graph of agents, MCP servers, tools and identities, built from passmcp's evidence.
site_url: https://sebastienrousseau.com/passmcp-graph/
copyright: '&copy; 2026 <a href="https://sebastienrousseau.com/" rel="author">Sebastien Rousseau</a>'
repo_url: https://github.com/sebastienrousseau/passmcp-graph
repo_name: sebastienrousseau/passmcp-graph
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: public
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Ingesting evidence: ingest.md
  - Query language: query-language.md
  - Policies: policy.md
  - Architecture: ARCHITECTURE.md
  - Comparison: COMPARISON.md
  - Benchmarks: BENCHMARKS.md
  - Decision records:
      - adr/README.md
      - "0001 No network": adr/0001-no-network.md
      - "0002 No secret reaches the store": adr/0002-no-secret-reaches-the-store.md
      - "0003 Server identity": adr/0003-server-identity-is-the-attestation-subject.md
      - "0004 Newer evidence wins": adr/0004-newer-evidence-wins.md
      - "0005 Data model in passmcp-reporting": adr/0005-data-model-in-passmcp-reporting.md
  - Release notes:
      - "0.0.4": releases/v0.0.4.md
      - "0.0.3": releases/v0.0.3.md
      - "0.0.2": releases/v0.0.2.md
      - "0.0.1": releases/v0.0.1.md

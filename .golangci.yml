version: "2"
linters:
  default: standard
  enable:
    - revive
    # A tool that reads operators' client configurations, where credentials
    # live, gets the security and correctness linters, not just the standard
    # set.
    - gosec
    - bodyclose
    - errorlint
    - nilerr
    - copyloopvar
    - makezero
    - rowserrcheck
    - noctx
    #
    # Complexity ceilings: a function nobody can hold in their head is where
    # a wrong answer hides. gocyclo, gocognit and funlen enforce the
    # portfolio's ceilings per function (cyclomatic 10, cognitive 15, 60
    # lines); every function outside the tests is under them, so there is
    # no baseline and a new offender fails the lint job. maintidx folds Halstead volume,
    # cyclomatic complexity and length into one maintainability index.
    - gocyclo
    - gocognit
    - nestif
    - funlen
    - maintidx
  settings:
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 5
    funlen:
      lines: 60
      statements: -1
    maintidx:
      under: 20
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
    gosec:
      excludes:
        # G104 duplicates errcheck, which is already in the standard set.
        - G104
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, revive, gosec, bodyclose, noctx]
      # A table-driven test is long by design; the ceilings are for code
      # that runs.
      - path: _test\.go
        linters: [gocyclo, gocognit, nestif, funlen, maintidx]

# gofmt runs as its own CI step, but only in CI. Declaring it here too means
# `golangci-lint run` locally reports the same formatting the gate enforces,
# rather than passing clean and letting the push find it.
formatters:
  enable:
    - gofmt

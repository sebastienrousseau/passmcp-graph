# SPDX-FileCopyrightText: 2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>
# SPDX-License-Identifier: GPL-3.0-only
#
# Machine-readable licensing, per the REUSE specification. Every source file
# carries an SPDX header and scripts/spdx_sweep.go fails the build when one
# does not; this file covers what a header cannot.

version = 1
SPDX-PackageName = "passmcp-graph"
SPDX-PackageSupplier = "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/sebastienrousseau/passmcp-graph"

# Go module metadata, the published JSON fixtures and repository
# configuration: formats that take no comments, or whose readers are not
# all sure to accept them (the devcontainer's JSON with comments).
[[annotations]]
path = ["go.mod", "go.sum", ".gitignore", "testdata/**", ".devcontainer/devcontainer.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# The README demo, rendered by `make demo` from .github/demo.tape; a GIF has
# nowhere to carry a header.
[[annotations]]
path = [".github/demo.gif"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# Generated by pip-compile, which rewrites the whole file: the manual's
# hash-locked build requirements, kept identical to passmcp's lock.
[[annotations]]
path = ["docs/requirements.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# Skeletonic Stylus's core stylesheet, vendored unmodified from the 3.0.0
# release (@sebastienrousseau/skeletonic-stylus, css/core/skeletonic.min.css,
# SHA-256 116dcdcf51009485eb2dbb6f5c773856f437d972ef277b31e2ee4ef587e1fb09)
# and embedded in the dashboard's stylesheet. A minified file kept byte for
# byte has no room for a header; its package declares MIT OR Apache-2.0.
[[annotations]]
path = ["internal/dashboard/third_party/skeletonic/skeletonic.min.css"]
precedence = "override"
SPDX-FileCopyrightText = "2023 - 2026 Skeletonic CSS"
SPDX-License-Identifier = "MIT OR Apache-2.0"
